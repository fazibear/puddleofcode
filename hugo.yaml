baseurl: https://puddleofcode.com/
languageCode: 'en-us'
summaryLength: 20
enableRobotsTXT: true
googleAnalytics: G-FXW2J6R5HC

paginate.pagerSize: 12

disableKinds:
  - taxonomy
  - term

permalinks:
  section:
    story: 'stories'
    project: 'projects'
    til: 'tils'

frontmatter:
  date:
    - :filename
    - :default

markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineAnchors: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: true
    noHl: false
    style: catppuccin-mocha
    tabWidth: 2

minify:
  tdewolff:
    html:
      keepComments: false
      keepConditionalComments: false
      keepDefaultAttrVals: true
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: true
      keepSpecialComments: true
      keepWhitespace: false

Params:
  title: Puddle Of Code
  author: Michał Kalbarczyk
  subtitle: Programming Adventures
  author_nick: fazibear
  author_image: /images/authors/fazibear.png
  description: Programming Adventures with Michał Kalbarczyk
